name: Verify DirectWrite Font Build on Windows (MSVC + Qt 6)

on:
  push:
    branches:
      - ci-verify
  workflow_dispatch:

jobs:
  verify:
    name: MSVC C++20 & DirectWrite Logic Verification
    runs-on: windows-latest

    steps:
      - name: Checkout lib_ui
        uses: actions/checkout@v4
        with:
          path: lib_ui

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Compile and Run DirectWrite Font Verification Test
        shell: pwsh
        run: |
          $qtDir = if ($env:QT_ROOT_DIR) { $env:QT_ROOT_DIR } elseif ($env:Qt6_DIR) { $env:Qt6_DIR } else { "D:\a\lib_ui\Qt\6.7.3\msvc2019_64" }
          Write-Host "Resolved Qt Directory: $qtDir"
          $qtInclude = "$qtDir/include"
          $qtLib = "$qtDir/lib"
          $qtBin = "$qtDir/bin"
          
          Write-Host "Compiling test_font_verification.cpp with MSVC cl.exe..."
          cl.exe /EHsc /std:c++20 `
            /I"$qtInclude" `
            /I"$qtInclude/QtCore" `
            /I"$qtInclude/QtGui" `
            lib_ui/tests/test_font_verification.cpp `
            /link /LIBPATH:"$qtLib" Qt6Core.lib Qt6Gui.lib `
            /OUT:test_font_verification.exe

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "Compilation SUCCESS! Running verification test binary..."
          
          $env:PATH = "$qtBin;$env:PATH"
          .\test_font_verification.exe

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Verification test failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host ">>> ALL CHECKS PASSED SUCCESSFULLY! <<<"
